<!DOCTYPE html>

<html lang="pt_br" data-theme="">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>BF: Photos</title>
  <link rel="stylesheet" href="css/styles.css">

  <!-- defer é algo relacionado ao processo de: -->
  <!-- começar a carregar o html, baixar o js, continua -->
  <!-- interpretando o html, executa o js -->
  <script src="js/theme.js"></script>
  <script src="js/photos.js" defer></script>

</head>

<body>
  <header>
    <h1>Bruno Ferreira</h1>
  </header>

  <main>
    <!-- section das fotos -->
    <section class="like-tui photos-section">
      <h2>Photos</h2>
      <!-- O grid é populado pelo JS via fetch('images/photos.json').
           Adicionar uma nova foto: copie o arquivo para images/,
           faça git commit e push — o CI gera o JSON e faz o deploy. -->
      <ul class="photo-grid"></ul>
    </section>

    <!-- O Modal (Dialog) nativo do HTML. Ele começa invisível. -->
    <dialog id="photo-modal" class="like-tui">
      <!-- Botão para fechar, útil para quem não quiser usar o 'Esc' -->
      <button id="close-modal" class="close-btn">[ X ] fechar</button>

      <div class="modal-content">
        <!-- Aqui a imagem em tamanho real será injetada pelo JS -->
        <img id="modal-image" src="" alt="Foto Expandida">

        <!-- O footer maximizado com os metadados. Uma Definition List (dl) é bem semântica para chave-valor -->
        <div class="modal-footer">
          <h3>Metadata</h3>
          <dl id="modal-metadata">
            <dt>Data:</dt>
            <dd id="meta-date"></dd>
            <dt>Sensor:</dt>
            <dd id="meta-sensor"></dd>
            <dt>Abertura:</dt>
            <dd id="meta-aperture"></dd>
            <dt>Tamanho:</dt>
            <dd id="meta-size"></dd>
          </dl>
        </div>
      </div>
    </dialog>

  </main>

</body>

</html>
