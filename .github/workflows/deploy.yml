name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv gerencia o venv e as dependências do projeto (Pillow, jsonschema).
      # setup-uv instala o uv no runner; uv sync instala o que está em uv.lock.
      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        # --no-install-project: instala só as dependências (Pillow, jsonschema)
        # sem tentar buildar o pacote homepage, que depende de src/ (não está no git)
        run: uv sync --no-install-project

      # Instala o typst CLI a partir do release oficial.
      # A versão é fixada para builds determinísticos — atualize quando necessário.
      - name: Install typst
        run: |
          TYPST_VERSION="0.15.1"
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst

      # Compila cada anotations.typ e injeta o resultado no bone.html único,
      # gerando o index.html de cada curso. Os index.html não estão no git —
      # eles são produzidos aqui e transferidos via rsync.
      - name: Compile courses
        run: bash scripts/merge.sh

      # Gera thumbnails para qualquer foto que ainda não tenha
      - name: Generate thumbnails
        run: .venv/bin/python scripts/generate_thumbnails.py

      # Gera images/photos.json a partir do EXIF das fotos em images/.
      # Como photos.json não está no git, o CI sempre parte do zero aqui.
      # Usa .venv/bin/python diretamente — uv run tentaria buildar o projeto.
      - name: Generate photos metadata
        run: .venv/bin/python scripts/extract_metadata.py

      # Valida o JSON gerado contra o contrato (images/photos-schema.json).
      # Retorna exit 1 se houver qualquer violação — os steps seguintes não rodam.
      # É aqui que o deploy é bloqueado se os dados estiverem fora do contrato.
      - name: Validate contract
        run: .venv/bin/python scripts/validate_contract.py

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # rsync sincroniza o diretório de trabalho do runner — que inclui os
      # index.html recém-gerados e o photos.json — para o VPS. O --delete remove
      # do servidor arquivos que não existem mais no repo (ex: fotos deletadas).
      - name: Deploy via rsync
        run: rsync -avz --delete --exclude='.git' --exclude='.github' --exclude='anotations.txt' -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/homepage/
