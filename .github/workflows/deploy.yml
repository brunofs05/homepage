name: Deploy to VPS

on:
  push:
    branches: [main]

# O workflow só precisa ler o repositório (checkout). Sem esta linha o GITHUB_TOKEN
# do job recebe as permissões padrão do repositório, que podem incluir escrita.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv gerencia o venv e as dependências dos scripts (Pillow, jsonschema).
      # setup-uv instala o uv no runner; uv sync instala o que está em uv.lock.
      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        # O pyproject.toml não tem [build-system], então o uv trata o projeto como
        # um conjunto de scripts: instala só as dependências, sem buildar nada.
        run: uv sync

      # Instala o typst CLI a partir do release oficial.
      # A versão é fixada para builds determinísticos — atualize quando necessário.
      - name: Install typst
        run: |
          TYPST_VERSION="0.15.1"
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst

      # Compila cada <seção>/<página>.typ (courses/, projects/) e injeta o resultado
      # no esqueleto (bone) do merge.sh, gerando <seção>/<página>.html ao lado do .typ.
      # Os .html não estão no git — eles são produzidos aqui e transferidos via rsync.
      - name: Compile pages
        run: bash scripts/merge.sh

      # Gera thumbnails para qualquer foto que ainda não tenha
      - name: Generate thumbnails
        run: .venv/bin/python scripts/generate_thumbnails.py

      # Gera images/photos.json a partir do EXIF das fotos em images/.
      # Como photos.json não está no git, o CI sempre parte do zero aqui.
      # Usa .venv/bin/python diretamente, o mesmo interpretador que o uv sync preparou.
      - name: Generate photos metadata
        run: .venv/bin/python scripts/extract_metadata.py

      # Valida o JSON gerado contra o contrato (images/photos-schema.json).
      # Retorna exit 1 se houver qualquer violação — os steps seguintes não rodam.
      # É aqui que o deploy é bloqueado se os dados estiverem fora do contrato.
      - name: Validate contract
        run: .venv/bin/python scripts/validate_contract.py

      # SSH_PRIVATE_KEY é a chave privada que autentica ESTE runner (GitHub Actions)
      # na VPS: a chave pública correspondente fica em ~/.ssh/authorized_keys do
      # usuário VPS_USER, no servidor. SSH_KNOWN_HOSTS guarda a identidade da VPS
      # (saída de `ssh-keyscan host`), para o rsync recusar um servidor impostor.
      # Os segredos entram por env: e não por ${{ }} dentro do script. Assim o valor
      # chega como variável de ambiente e nunca é colado no texto do comando shell.
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # rsync envia só o site, conforme scripts/deploy-filter.txt (páginas, css, js,
      # imagens e os .html gerados de courses/ e projects/). Fontes (.typ, fotos das
      # páginas, scripts/, pyproject, uv.lock) ficam no repositório e não chegam ao servidor.
      # --delete remove do servidor o que sumiu do repo (ex: fotos deletadas);
      # --delete-excluded remove também o que está FORA da lista (ex: scripts/ enviados
      # pelo deploy antigo). Recusa apagar o que a lista protege com "P".
      - name: Deploy via rsync
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: rsync -avz --delete --delete-excluded --filter='. scripts/deploy-filter.txt' -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" ./ "$VPS_USER@$VPS_HOST:/var/www/homepage/"
